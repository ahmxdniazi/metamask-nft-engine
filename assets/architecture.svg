    <text x="795" y="218" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="#00ff88">🔍</text>
    <text x="795" y="240" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#ffffff" font-weight="bold">Etherscan</text>
    <text x="795" y="258" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#aaaacc">Block Explorer</text>
    <text x="795" y="275" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#00ff88">Verify TXNs</text>
    <rect x="720" y="180" width="150" height="4" rx="2" fill="#00ff88" opacity="0.6"/>
