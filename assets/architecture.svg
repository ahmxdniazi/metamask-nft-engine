<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#0d1b3e"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a4a"/>
      <stop offset="100%" style="stop-color:#0d1b3e"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00d4ff" flood-opacity="0.3"/>
    </filter>
    <filter id="glowF">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4ff"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F6851B"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.05" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="50" x2="900" y2="50"/><line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/><line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/><line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="350" x2="900" y2="350"/><line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="450" x2="900" y2="450"/>
    <line x1="90" y1="0" x2="90" y2="500"/><line x1="180" y1="0" x2="180" y2="500"/>
    <line x1="270" y1="0" x2="270" y2="500"/><line x1="360" y1="0" x2="360" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/><line x1="540" y1="0" x2="540" y2="500"/>
    <line x1="630" y1="0" x2="630" y2="500"/><line x1="720" y1="0" x2="720" y2="500"/>
    <line x1="810" y1="0" x2="810" y2="500"/>
  </g>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#00d4ff" letter-spacing="4" opacity="0.9">SYSTEM ARCHITECTURE</text>

  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="30" y="190" width="130" height="90" rx="10" fill="url(#box1)" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="95" y="220" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="#00d4ff">👤</text>
    <text x="95" y="242" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#ffffff" font-weight="bold">USER</text>
    <text x="95" y="258" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#aaaacc">Student/Researcher</text>
    <rect x="30" y="190" width="130" height="4" rx="2" fill="#00d4ff" opacity="0.6"/>
  </g>

  <!-- MetaMask -->
  <g filter="url(#shadow)">
    <rect x="250" y="80" width="150" height="100" rx="10" fill="url(#box1)" stroke="#F6851B" stroke-width="1.5"/>
    <text x="325" y="118" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" fill="#F6851B">🦊</text>
    <text x="325" y="143" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#ffffff" font-weight="bold">MetaMask</text>
    <text x="325" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#aaaacc">Browser Extension</text>
    <text x="325" y="173" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#F6851B">0xa755...594D</text>
    <rect x="250" y="80" width="150" height="4" rx="2" fill="#F6851B" opacity="0.6"/>
  </g>

  <!-- OpenSea -->
  <g filter="url(#shadow)">
    <rect x="250" y="310" width="150" height="100" rx="10" fill="url(#box1)" stroke="#2081E2" stroke-width="1.5"/>
    <text x="325" y="348" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" fill="#2081E2">🌊</text>
    <text x="325" y="373" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#ffffff" font-weight="bold">OpenSea</text>
    <text x="325" y="390" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#aaaacc">NFT Marketplace</text>
    <text x="325" y="403" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#2081E2">Buy · Sell · Trade</text>
    <rect x="250" y="310" width="150" height="4" rx="2" fill="#2081E2" opacity="0.6"/>
  </g>

  <!-- Ethereum Blockchain -->
  <g filter="url(#shadow)">
    <rect x="510" y="180" width="160" height="110" rx="10" fill="url(#box1)" stroke="#627EEA" stroke-width="1.5"/>
    <text x="590" y="220" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" fill="#627EEA">⬡</text>
    <text x="590" y="245" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#ffffff" font-weight="bold">Ethereum</text>
    <text x="590" y="263" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#aaaacc">Blockchain Network</text>
    <text x="590" y="280" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#627EEA">ERC-721 · ERC-1155</text>
    <rect x="510" y="180" width="160" height="4" rx="2" fill="#627EEA" opacity="0.6"/>
  </g>

  <!-- Smart Contract -->
  <g filter="url(#shadow)">
    <rect x="510" y="340" width="160" height="100" rx="10" fill="url(#box1)" stroke="#aa44ff" stroke-width="1.5"/>
    <text x="590" y="378" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="#aa44ff">📜</text>
    <text x="590" y="400" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#ffffff" font-weight="bold">Smart Contract</text>
    <text x="590" y="418" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#aaaacc">NFT Contract Logic</text>
    <text x="590" y="432" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#aa44ff">0x2358...a68b</text>
    <rect x="510" y="340" width="160" height="4" rx="2" fill="#aa44ff" opacity="0.6"/>
  </g>

  <!-- Etherscan -->
  <g filter="url(#shadow)">
