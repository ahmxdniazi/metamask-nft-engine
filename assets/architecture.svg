  <!-- Arrows: User → MetaMask -->
  <line x1="160" y1="210" x2="248" y2="155" stroke="#F6851B" stroke-width="1.5" marker-end="url(#arrowOrange)" stroke-dasharray="5,3"/>
  <text x="200" y="175" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#F6851B">Install &amp; Setup</text>

  <!-- User → OpenSea -->
  <line x1="160" y1="265" x2="248" y2="355" stroke="#2081E2" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="195" y="330" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#2081E2">Browse NFTs</text>

  <!-- MetaMask → Ethereum -->
  <line x1="400" y1="150" x2="508" y2="218" stroke="#627EEA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="175" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#627EEA">Sign TXN</text>

  <!-- OpenSea → Ethereum -->
  <line x1="400" y1="360" x2="508" y2="305" stroke="#627EEA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="345" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#627EEA">Execute Order</text>

  <!-- Ethereum → Etherscan -->
  <line x1="670" y1="235" x2="718" y2="235" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="694" y="225" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#00ff88">Record</text>

  <!-- Ethereum → Smart Contract -->
  <line x1="590" y1="290" x2="590" y2="338" stroke="#aa44ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="320" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#aa44ff">Deploy</text>

  <!-- MetaMask ↔ OpenSea -->
  <line x1="325" y1="180" x2="325" y2="308" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="295" y="250" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#00d4ff">Connect</text>
  <circle cx="325" cy="244" r="4" fill="#00d4ff" opacity="0.8"/>

  <!-- Legend -->
  <rect x="30" y="390" width="200" height="90" rx="8" fill="#0d0d1a" stroke="#333355" stroke-width="1"/>
  <text x="130" y="408" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#666688">LEGEND</text>
  <line x1="45" y1="422" x2="75" y2="422" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="80" y="426" font-family="'Courier New', monospace" font-size="8" fill="#aaaacc">Secure Connection</text>
  <line x1="45" y1="440" x2="75" y2="440" stroke="#627EEA" stroke-width="1.5"/>
  <text x="80" y="444" font-family="'Courier New', monospace" font-size="8" fill="#aaaacc">Blockchain TXN</text>
  <line x1="45" y1="458" x2="75" y2="458" stroke="#F6851B" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="80" y="462" font-family="'Courier New', monospace" font-size="8" fill="#aaaacc">Wallet Operation</text>
  <line x1="45" y1="472" x2="75" y2="472" stroke="#aa44ff" stroke-width="1.5"/>
  <text x="80" y="476" font-family="'Courier New', monospace" font-size="8" fill="#aaaacc">Smart Contract</text>

  <!-- Bottom label -->
  <text x="450" y="488" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#444466">MetaMask Wallet &amp; NFT Hands-on · Muhammad Ahmad · 25I-7705</text>
</svg>
