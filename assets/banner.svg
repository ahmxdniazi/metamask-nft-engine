<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1b3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a1a;stop-opacity:1" />
    </linearGradient>
    <!-- Cyan glow -->
    <radialGradient id="glowCyan" cx="25%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </radialGradient>
    <!-- Orange glow -->
    <radialGradient id="glowOrange" cx="80%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#F6851B;stop-opacity:0.22" />
      <stop offset="100%" style="stop-color:#F6851B;stop-opacity:0" />
    </radialGradient>
    <!-- Chain link gradient -->
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <!-- Text gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#e0f7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <!-- NFT card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b3e;stop-opacity:1" />
    </linearGradient>
    <!-- Hexagon clip -->
    <clipPath id="hexClip">
      <polygon points="60,10 110,37 110,93 60,120 10,93 10,37"/>
    </clipPath>
    <!-- Filter glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" fill="url(#glowCyan)"/>
  <rect width="1200" height="340" fill="url(#glowOrange)"/>

  <!-- Grid pattern -->
  <g opacity="0.07" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="100" y1="0" x2="100" y2="340"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="500" y1="0" x2="500" y2="340"/>
    <line x1="600" y1="0" x2="600" y2="340"/>
    <line x1="700" y1="0" x2="700" y2="340"/>
    <line x1="800" y1="0" x2="800" y2="340"/>
    <line x1="900" y1="0" x2="900" y2="340"/>
    <line x1="1000" y1="0" x2="1000" y2="340"/>
    <line x1="1100" y1="0" x2="1100" y2="340"/>
  </g>

  <!-- Decorative hexagons LEFT -->
  <g opacity="0.15">
    <polygon points="30,30 70,10 110,30 110,70 70,90 30,70" fill="none" stroke="#00d4ff" stroke-width="1"/>
    <polygon points="0,100 40,80 80,100 80,140 40,160 0,140" fill="none" stroke="#00d4ff" stroke-width="0.8"/>
    <polygon points="50,180 90,160 130,180 130,220 90,240 50,220" fill="none" stroke="#00d4ff" stroke-width="0.6"/>
  </g>

  <!-- Decorative hexagons RIGHT -->
  <g opacity="0.15">
    <polygon points="1090,30 1130,10 1170,30 1170,70 1130,90 1090,70" fill="none" stroke="#F6851B" stroke-width="1"/>
    <polygon points="1120,100 1160,80 1200,100 1200,140 1160,160 1120,140" fill="none" stroke="#F6851B" stroke-width="0.8"/>
    <polygon points="1070,180 1110,160 1150,180 1150,220 1110,240 1070,220" fill="none" stroke="#F6851B" stroke-width="0.6"/>
  </g>

  <!-- Blockchain link animation dots -->
  <circle cx="150" cy="170" r="3" fill="#00d4ff" opacity="0.6"/>
  <circle cx="250" cy="120" r="2" fill="#00d4ff" opacity="0.4"/>
  <circle cx="180" cy="250" r="2.5" fill="#00d4ff" opacity="0.5"/>
  <circle cx="1000" cy="150" r="3" fill="#F6851B" opacity="0.6"/>
  <circle cx="1050" cy="80" r="2" fill="#F6851B" opacity="0.4"/>
  <circle cx="980" cy="240" r="2.5" fill="#F6851B" opacity="0.5"/>

  <!-- Connecting lines -->
  <line x1="150" y1="170" x2="250" y2="120" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>
  <line x1="250" y1="120" x2="180" y2="250" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>
  <line x1="1000" y1="150" x2="1050" y2="80" stroke="#F6851B" stroke-width="0.5" opacity="0.3"/>
  <line x1="1050" y1="80" x2="980" y2="240" stroke="#F6851B" stroke-width="0.5" opacity="0.3"/>

  <!-- MetaMask Fox Icon (stylized) -->
  <g transform="translate(220, 90)" filter="url(#glow)">
    <!-- Fox body -->
    <polygon points="60,140 20,0 100,0" fill="#F6851B" opacity="0.9"/>
    <polygon points="60,140 0,40 20,0" fill="#E2761B" opacity="0.9"/>
    <polygon points="60,140 100,0 120,40" fill="#E2761B" opacity="0.9"/>
    <!-- Fox face -->
    <polygon points="60,100 35,60 85,60" fill="#FCD9AD" opacity="0.9"/>
    <polygon points="60,100 35,60 45,80" fill="#F6851B" opacity="0.7"/>
    <polygon points="60,100 85,60 75,80" fill="#F6851B" opacity="0.7"/>
    <!-- Eyes -->
    <circle cx="47" cy="68" r="5" fill="#763D16"/>
    <circle cx="73" cy="68" r="5" fill="#763D16"/>
    <circle cx="48" cy="67" r="2" fill="white"/>
    <circle cx="74" cy="67" r="2" fill="white"/>
  </g>

  <!-- Ethereum Logo (stylized) -->
  <g transform="translate(870, 85)" filter="url(#glow)">
    <polygon points="60,0 60,100 110,60" fill="#627EEA" opacity="0.6"/>
    <polygon points="60,0 60,100 10,60" fill="#8EA3F2" opacity="0.8"/>
    <polygon points="60,110 60,160 110,70" fill="#627EEA" opacity="0.5"/>
    <polygon points="60,110 60,160 10,70" fill="#8EA3F2" opacity="0.7"/>
    <polygon points="60,0 60,60 110,60" fill="#627EEA" opacity="0.9"/>
    <polygon points="60,0 60,60 10,60" fill="#8EA3F2" opacity="0.9"/>
  </g>

  <!-- Main Title -->
  <text x="600" y="118" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#00d4ff" letter-spacing="5" opacity="0.9">BLOCKCHAIN &amp; WEB3 SECURITY</text>

  <text x="600" y="185" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="bold" fill="url(#titleGrad)" filter="url(#textGlow)" letter-spacing="1">MetaMask &amp; NFT</text>

  <text x="600" y="225" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#e0e0e0" letter-spacing="3">Hands-on Activity</text>

  <!-- Divider line -->
  <line x1="350" y1="243" x2="850" y2="243" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <circle cx="350" cy="243" r="3" fill="#00d4ff" opacity="0.8"/>
  <circle cx="850" cy="243" r="3" fill="#00d4ff" opacity="0.8"/>
  <circle cx="600" cy="243" r="2" fill="#00d4ff" opacity="0.6"/>

  <!-- Bottom info -->
  <text x="600" y="270" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#aaaacc" letter-spacing="2">Muhammad Ahmad · 25I-7705 · MS Cybersecurity</text>
  <text x="600" y="292" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#666688" letter-spacing="1">Secure System Design · FAST NUCES · Prof. Zafar Iqbal</text>

  <!-- Badge pills -->
  <rect x="340" y="308" width="90" height="20" rx="10" fill="#1a3a1a" stroke="#00ff88" stroke-width="1"/>
  <text x="385" y="322" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#00ff88">ERC-721</text>

  <rect x="442" y="308" width="100" height="20" rx="10" fill="#1a1a3a" stroke="#627EEA" stroke-width="1"/>
  <text x="492" y="322" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#627EEA">ETHEREUM</text>

  <rect x="554" y="308" width="90" height="20" rx="10" fill="#3a1a0a" stroke="#F6851B" stroke-width="1"/>
  <text x="599" y="322" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#F6851B">METAMASK</text>

  <rect x="656" y="308" width="90" height="20" rx="10" fill="#0a1a3a" stroke="#2081E2" stroke-width="1"/>
  <text x="701" y="322" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#2081E2">OPENSEA</text>

  <rect x="758" y="308" width="100" height="20" rx="10" fill="#1a0a2a" stroke="#aa44ff" stroke-width="1"/>
  <text x="808" y="322" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#aa44ff">BLOCKCHAIN</text>

  <!-- Corner decorations -->
  <rect x="0" y="0" width="8" height="40" fill="#00d4ff" opacity="0.8"/>
  <rect x="0" y="0" width="40" height="8" fill="#00d4ff" opacity="0.8"/>
  <rect x="1192" y="0" width="8" height="40" fill="#F6851B" opacity="0.8"/>
  <rect x="1160" y="0" width="40" height="8" fill="#F6851B" opacity="0.8"/>
  <rect x="0" y="300" width="8" height="40" fill="#00d4ff" opacity="0.8"/>
  <rect x="0" y="332" width="40" height="8" fill="#00d4ff" opacity="0.8"/>
  <rect x="1192" y="300" width="8" height="40" fill="#F6851B" opacity="0.8"/>
  <rect x="1160" y="332" width="40" height="8" fill="#F6851B" opacity="0.8"/>
</svg>
